<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoBank - Fintech UI</title>
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --primary: #CCFF00; /* Neon Lime */
            --text: #FFFFFF;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Satoshi', sans-serif; display: flex; justify-content: center; padding: 40px; }
        .phone { width: 320px; height: 650px; border: 8px solid #333; border-radius: 40px; padding: 20px; background: var(--bg); overflow: hidden; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .balance-card { background: var(--primary); color: #000; padding: 25px; border-radius: 24px; margin-bottom: 30px; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .action-btn { width: 50px; height: 50px; background: var(--card); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .transaction { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #222; }
        .chip { padding: 4px 12px; background: var(--primary); color: black; border-radius: 20px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="phone">
        <div class="header">
            <span>Hi, Rohit</span>
            <div style="width: 40px; height: 40px; background: #333; border-radius: 50%;"></div>
        </div>
        <div class="balance-card">
            <div style="font-size: 14px; opacity: 0.8;">Total Balance</div>
            <div style="font-size: 32px; font-weight: 900;">$24,500.00</div>
        </div>
        <div class="btn-grid">
            <div class="action-btn">↑</div>
            <div class="action-btn">↓</div>
            <div class="action-btn">💳</div>
            <div class="action-btn">⋮</div>
        </div>
        <h3 style="margin-top: 30px;">Recent Activity</h3>
        <div class="transaction"><span>Netflix</span><b>-$15.99</b></div>
        <div class="transaction"><span>Apple Inc.</span><b>+$1,200.00</b></div>
        <div class="transaction"><span>Starbucks</span><b>-$6.50</b></div>
    </div>
</body>
</html>
